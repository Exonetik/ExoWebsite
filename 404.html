<style>
  @font-face {
    font-family: 'Telegraf';
    src: url('/static/fonts/Telegraf-Bold.ac7f6bd3.woff') format('woff');
    font-weight: 700;
    font-display: swap;
  }
  @font-face {
    font-family: 'NeueMontreal';
    src: url('/static/fonts/NeueMontreal-Regular.51a78a86.woff') format('woff');

    font-display: swap;
  }
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: 'NeueMontreal', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px calc(32px + env(safe-area-inset-bottom, 0px));

  }
  main { max-width: 540px; width: 100%; }
  .code {
    font-family: 'Telegraf', Helvetica, Arial, sans-serif;
    font-weight: 700;
    font-size: clamp(64px, 18vw, 128px);

    letter-spacing: -0.02em;
    margin: 0 0 12px;
    color: #0071CE;
  }
  h1 {
    font-family: 'Telegraf', Helvetica, Arial, sans-serif;
    font-weight: 700;
    font-size: clamp(22px, 5vw, 32px);
    line-height: 1.25;
    margin: 0 0 8px;
  }
  .fr { color: #8E9296; font-size: clamp(15px, 3.6vw, 18px); margin: 0 0 32px; }
  .links { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  a.button {
    display: inline-block;
    padding: 14px 28px;
    border-radius: 999px;
    background: #fff;
    color: #000;
    text-decoration: none;
    font-size: 15px;
    transition: opacity .2s ease;
  }
  a.button.is-outline { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.35); }
  a.button:hover { opacity: .8; }
  .contact { margin: 36px 0 0; font-size: 14px; color: #8E9296; }
  .contact a { color: #fff; }
