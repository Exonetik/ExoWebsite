# nginx configuration for the static exonetik.com site,
# served locally and published through a Cloudflare tunnel.
#
# Copy to /etc/nginx/sites-available/exonetik, then:
#   ln -sf /etc/nginx/sites-available/exonetik /etc/nginx/sites-enabled/exonetik
#   nginx -t && nginx -s reload

server {
    listen 8081;
    server_name www.exonetik.com exonetik.com _;

    root /var/www/exonetik;      # <- adjust to where this repository is deployed
    index index.html;
    charset utf-8;

    # --- Why the public site used to jump to :8081 -------------------------
    # The pages live in directories (careers/index.html), so a request for
    # /careers made nginx answer "301 -> http://www.exonetik.com:8081/careers/".
    # nginx builds that absolute URL from its own listening port and from the
    # scheme it sees, which is plain http behind the tunnel. The visitor's
    # browser then followed it to a port Cloudflare does not serve.
    #
    # try_files below serves careers/index.html directly for /careers, so no
    # redirect is emitted at all and the clean URLs stay as they are. The two
    # directives are a safety net for any redirect nginx may still produce
    # (they keep it relative, with no host, port or scheme).
    absolute_redirect off;
    port_in_redirect off;

    # Pages are served with no-cache so an edit shows up on the next visit.
    # (expires is used rather than add_header, because a location that sets
    # add_header stops inheriting the ones declared at server level.)
    location / {
        try_files $uri $uri/index.html $uri/ =404;
        expires -1;
    }

    # --- Custom 404 --------------------------------------------------------
    error_page 404 /404.html;
    location = /404.html {
        internal;
        expires -1;
    }

    # --- Caching -----------------------------------------------------------
    # Build assets carry a content hash in their filename, so they can be
    # cached hard; photos come from the former Craft asset bucket and change
    # rarely.
    location ~* ^/(static|exonetik)/ {
        access_log off;
        # one Cache-Control only: "expires 1y" here would emit a second,
        # conflicting header alongside the one below.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # The JSON the front-end reads is content: same rule as the pages.
    location ~* \.json$ {
        expires -1;
    }

    location = /sitemap.xml { expires 1h; }
    location = /robots.txt  { expires 1h; }

    # --- Compression -------------------------------------------------------
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/xml
        application/xml+rss image/svg+xml;

    # --- Misc --------------------------------------------------------------
    # The tunnel already serves the site over https, so tell browsers the
    # content type and nothing more; no redirect to https here, that would
    # loop behind the tunnel.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~ /\.(?!well-known) { deny all; }   # hide dotfiles (.git, ...)
}
